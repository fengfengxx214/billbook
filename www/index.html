/* ============ 文本编码自适应 ============ */
function decodeBytes(u8){
  const cnt = s => (s.match(/\uFFFD/g)||[]).length;
  let utf8 = '';
  try{ utf8 = new TextDecoder('utf-8').decode(u8); }catch(e){}
  if(u8[0]===0xEF && u8[1]===0xBB && u8[2]===0xBF) return utf8.replace(/^\uFEFF/,'');
  let gbk = '';
  try{ gbk = new TextDecoder('gb18030').decode(u8); }catch(e){}
  if(gbk && cnt(gbk) < cnt(utf8)) return gbk;
  return utf8.replace(/^\uFEFF/,'');
}

/* ============ 极简 ZIP + XLSX 解析（无外部依赖） ============ */
async function inflateRaw(data){
  if(typeof DecompressionStream === 'undefined')
    throw new Error('这台设备的浏览器不支持解压 xlsx，请在电脑上把 xlsx 另存为 CSV 再导入');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function readZipEntries(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('不是有效的 xlsx / zip 文件');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const td = new TextDecoder('utf-8');
  const entries = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = td.decode(u8.subarray(p + 46, p + 46 + nlen));
    entries[name] = { method, csize, lho };
    p += 46 + nlen + elen + clen;
  }
  return { u8, dv, entries };
}
async function zipReadBytes(zip, name){
  const e = zip.entries[name];
  if(!e) return null;
  const nlen = zip.dv.getUint16(e.lho + 26, true);
  const elen = zip.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const raw = zip.u8.subarray(start, start + e.csize);
  return e.method === 0 ? raw : await inflateRaw(raw);
}
async function zipReadText(zip, name){
  const b = await zipReadBytes(zip, name);
  return b ? new TextDecoder('utf-8').decode(b) : '';
}
function colLetterToIndex(s){
  let n = 0;
  for(const ch of String(s).toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function excelSerialToDate(n){
  const ms = Math.round((n - 25569) * 86400 * 1000);
  const d = new Date(ms);
  if(isNaN(d.getTime())) return '';
  const p = x => String(x).padStart(2,'0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth()+1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
async function readXlsx(buf){
  const zip = readZipEntries(buf);
  let shared = [];
  const ssXml = await zipReadText(zip, 'xl/sharedStrings.xml');
  if(ssXml){
    const doc = new DOMParser().parseFromString(ssXml, 'application/xml');
    shared = [...doc.getElementsByTagName('si')].map(si =>
      [...si.getElementsByTagName('t')].map(t => t.textContent).join(''));
  }
  const sheetName = Object.keys(zip.entries).filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort()[0];
  if(!sheetName) throw new Error('这份 xlsx 里找不到工作表');
  const xml = await zipReadText(zip, sheetName);
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const rows = [];
  for(const row of doc.getElementsByTagName('row')){
    const arr = [];
    for(const c of row.getElementsByTagName('c')){
      const ref = c.getAttribute('r') || '';
      const col = colLetterToIndex(ref.replace(/\d+/g,'') || 'A');
      const t = c.getAttribute('t');
      let val = '';
      if(t === 'inlineStr'){
        val = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      }else{
        const v = c.getElementsByTagName('v')[0];
        if(v){
          val = v.textContent;
          if(t === 's') val = (shared[+val] != null ? shared[+val] : '');
          else if(t === 'b') val = val === '1' ? 'TRUE' : 'FALSE';
        }
      }
      arr[col >= 0 ? col : arr.length] = val;
    }
    rows.push([...arr].map(x => x == null ? '' : x));
  }
  return rows;
}

/* ============ CSV 解析 ============ */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const rows=[]; let row=[], f='', inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else inQ=false; }
      else f+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){ row.push(f); f=''; }
      else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
      else f+=c;
    }
  }
  row.push(f); rows.push(row);
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}

/* ============ 文件入口：xlsx / zip / csv 通吃 ============ */
async function readAnyFile(file){
  const buf = await file.arrayBuffer();
  const u8 = new Uint8Array(buf);
  const isZip = u8[0] === 0x50 && u8[1] === 0x4B;
  if(isZip || /\.xlsx$/i.test(file.name||'')){
    const zip = readZipEntries(buf);
    // 支付宝导出：zip 里装的是 CSV（GBK）
    const csvName = Object.keys(zip.entries).find(n => /\.(csv|txt)$/i.test(n));
    if(csvName){
      const bytes = await zipReadBytes(zip, csvName);
      return { kind:'zip/csv', rows: parseCSV(decodeBytes(bytes)) };
    }
    // 微信导出：xlsx（zip 里是 XML）
    return { kind:'xlsx', rows: await readXlsx(buf) };
  }
  return { kind:'csv', rows: parseCSV(decodeBytes(u8)) };
}

/* ============ 字段标准化 ============ */
function normTime(s){
  const raw = String(s==null?'':s).trim();
  if(/^\d{5}(\.\d+)?$/.test(raw)){
    const d = excelSerialToDate(parseFloat(raw));
    if(d) return d;
  }
  const t = raw.replace(/[年月]/g,'-').replace(/日/g,'').replace(/\//g,'-').replace(/\s+/g,' ');
  const m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(!m) return '';
  const p = n => String(n).padStart(2,'0');
  return `${m[1]}-${p(m[2])}-${p(m[3])} ${m[4]?p(m[4]):'00'}:${m[5]||'00'}`;
}
function parseAmount(s){
  const m = String(s==null?'':s).replace(/[¥￥,，\s元]/g,'').match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function normDir(s){
  const t = String(s==null?'':s).trim();
  if(t.includes('支出')) return '支出';
  if(t.includes('收入')) return '收入';
  if(t.includes('不计')) return '不计收支';
  return t || '支出';
}
function classifyChannel(raw){
  const s = String(raw==null?'':raw).replace(/\s/g,'');
  if(!s) return '其他';
  if(/亲情卡|亲属卡/.test(s)) return '亲情卡';
  if(/零钱通|零钱|账户余额|余额宝|^余额/.test(s)) return '零钱/余额';
  if(/花呗|借呗|分付|白条|月付|信用付/.test(s)) return '信用支付';
  if(/银行|储蓄卡|借记卡|信用卡|银联/.test(s)) return '银行卡';
  return '其他';
}
function classifyCategory(t){
  if(state.merchantMap[t.title]) return state.merchantMap[t.title];
  const text = [t.title, t.product, t.rawType, t.note].filter(Boolean).join(' ');
  for(const r of state.rules.concat(DEFAULT_RULES)) if(r.kw.some(k => k && text.includes(k))) return r.cat;
  if(ALI_CAT[t.rawType]) return ALI_CAT[t.rawType];
  if(WX_TYPE[t.rawType]) return WX_TYPE[t.rawType];
  if(t.direction !== '支出') return '转账';
  return '其他';
}
function applyLearn(){
  state.tx.forEach(t=>{
    if(!t.chManual) t.channel = state.payMap[t.payRaw] || classifyChannel(t.payRaw);
    if(!t.catManual) t.cat = classifyCategory(t);
  });
}
const txKey = t => t.orderNo ? t.source+'|'+t.orderNo : [t.source,t.time,t.title,t.amount,t.direction].join('|');

/* ============ 导入：二维数组 → 记录 ============ */
function findHeader(rows){
  for(let i=0;i<Math.min(rows.length,60);i++){
    const j = rows[i].map(x => String(x==null?'':x).trim()).join(',');
    if(/交易时间|付款时间|交易日期|交易创建时间/.test(j) && /金额/.test(j)) return i;
  }
  return -1;
}
function importRows(rows){
  const hi = findHeader(rows);
  if(hi < 0) throw new Error('没找到表头（需要同时有“交易时间”和“金额”列）。如果这份导出格式又变了，把前 20 行发我。');
  const h = rows[hi].map(x => String(x==null?'':x).replace(/\s/g,''));
  const head = rows.slice(0, Math.min(rows.length, 30)).map(r => r.join(',')).join('\n');
  const source = head.includes('微信') ? '微信' : (head.includes('支付宝') ? '支付宝' : (h.some(x=>x.includes('收/付款方式')) ? '支付宝' : '其他'));
  const idx = {
    time:  colIdx(h,['交易时间','付款时间','交易创建时间']),
    type:  colIdx(h,['交易分类','交易类型']),
    title: colIdx(h,['交易对方','对方','商户名称','商户']),
    prod:  colIdx(h,['商品说明','商品名称','商品']),
    dir:   colIdx(h,['收/支','收支']),
    amt:   colIdx(h,['金额']),
    pay:   colIdx(h,['收/付款方式','支付方式','付款方式']),
    st:    colIdx(h,['交易状态','当前状态']),
    ord:   colIdx(h,['交易订单号','交易单号','交易号']),
    ord2:  colIdx(h,['商家订单号','商户单号']),
    note:  colIdx(h,['备注'])
  };
  const out = [];
  for(let r = hi+1; r < rows.length; r++){
    const row = rows[r];
    if(!row) continue;
    const g = i => (i>=0 && row[i]!=null) ? String(row[i]).trim() : '';
    if(/^(共|合计|总计|以上)/.test(g(0))) continue;
    const time = normTime(g(idx.time));
    if(!time) continue;
    const title = g(idx.title) || g(idx.prod) || '未知';
    const t = {
      id:'', source, time, month: time.slice(0,7), date: time.slice(0,10),
      title, product: g(idx.prod), rawType: g(idx.type),
      direction: normDir(g(idx.dir)), amount: parseAmount(g(idx.amt)),
      payRaw: g(idx.pay), channel:'', cat:'',
      status: g(idx.st), orderNo: g(idx.ord) || g(idx.ord2), note: g(idx.note),
      catManual:false, chManual:false
    };
    t.channel = state.payMap[t.payRaw] || classifyChannel(t.payRaw);
    t.cat = classifyCategory(t);
    out.push(t);
  }
  return { source, txs: out };
}
const colIdx = (h, names) => { for(const n of names){ const i = h.findIndex(x => x.includes(n)); if(i>=0) return i; } return -1; };

/* ============ 导入执行 ============ */
function addTxs(txs){
  const keys = new Set(state.tx.map(txKey));
  let added = 0, dup = 0;
  txs.forEach(t=>{
    const k = txKey(t);
    if(keys.has(k)){ dup++; return; }
    keys.add(k); t.id = uid(); state.tx.push(t); added++;
  });
  return { added, dup };
}
async function handleFiles(files){
  let added = 0, dup = 0; const fail = [];
  for(const f of files){
    try{
      const res = await readAnyFile(f);
      const r = addTxs(res.rows.length ? importRows(res.rows).txs : []);
      added += r.added; dup += r.dup;
    }catch(e){ fail.push(f.name + '：' + e.message); }
  }
  save(); page = 1; renderAll();
  alert(`导入完成：新增 ${added} 笔，跳过重复 ${dup} 笔` + (fail.length ? '\n失败 ' + fail.length + ' 个：\n' + fail.join('\n') : ''));
}

/* ============ 筛选与渲染 ============ */
function filtered(){
  return state.tx.filter(t=>{
    if(F.month && t.month !== F.month) return false;
    if(F.source && t.source !== F.source) return false;
    if(F.channel && t.channel !== F.channel) return false;
    if(F.cat && t.cat !== F.cat) return false;
    if(F.kw){
      const k = F.kw.toLowerCase();
      if(!(t.title+' '+t.product+' '+t.note).toLowerCase().includes(k)) return false;
    }
    return true;
  }).sort((a,b) => b.time.localeCompare(a.time));
}
function renderFilters(){
  const months = [...new Set(state.tx.map(t=>t.month))].sort().reverse();
  const opts = (arr, cur, all) => `<option value="">${all}</option>` + arr.map(v=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(v)}</option>`).join('');
  $('#fMonth').innerHTML = opts(months, F.month, '全部月份');
  $('#fSource').innerHTML = opts([...new Set(state.tx.map(t=>t.source))].sort(), F.source, '全部来源');
  $('#fChannel').innerHTML = opts(CHANNELS, F.channel, '全部渠道');
  const catList = [...new Set(state.tx.map(t=>t.cat))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  $('#fCat').innerHTML = opts(catList, F.cat, '全部分类');
  $('#rCat').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
}
function txHtml(t){
  const catOpts = CATS.map(c=>`<option${c===t.cat?' selected':''}>${c}</option>`).join('');
  const chOpts = CHANNELS.map(c=>`<option${c===t.channel?' selected':''}>${c}</option>`).join('');
  const sign = t.direction==='支出' ? '-' : (t.direction==='收入' ? '+' : '');
  const cls = t.direction==='支出' ? 'exp' : (t.direction==='收入' ? 'inc' : '');
  return `<div class="tx" data-id="${t.id}">
    <div class="top"><div class="t">${esc(t.title)}</div><div class="amt ${cls}">${sign}${money(t.amount)}</div></div>
    <div class="tags">
      <span class="tag">${esc(t.time.slice(0,16))}</span>
      <span class="tag ${t.source==='微信'?'wx':(t.source==='支付宝'?'ali':'')}">${esc(t.source)}</span>
      <span class="tag">${esc(t.payRaw||'支付方式未知')}</span>
      <select class="mini catSel">${catOpts}</select>
      <select class="mini chSel">${chOpts}</select>
      <button class="btn danger mini" data-act="del" style="padding:2px 8px;font-size:12px">删</button>
    </div>
    ${(t.product||t.note) ? `<div class="muted" style="margin-top:4px">${esc([t.product,t.note].filter(Boolean).join(' · '))}</div>` : ''}
  </div>`;
}
function renderList(){
  const list = filtered();
  const shown = list.slice(0, page*PAGE);
  $('#listBox').innerHTML = list.length
    ? shown.map(txHtml).join('')
    : '<p class="muted" style="margin:0">没有匹配的记录。先去「导入/设置」页导入账单，或点「生成示例数据试用」。</p>';
  $('#btnMore').classList.toggle('hide', shown.length >= list.length);
  const exp = list.filter(t=>t.direction==='支出').reduce((s,t)=>s+t.amount,0);
  const inc = list.filter(t=>t.direction==='收入').reduce((s,t)=>s+t.amount,0);
  $('#countInfo').textContent = `${list.length} 笔｜支出 ${money(exp)}｜收入 ${money(inc)}`;
}
function bars(obj){
  const ents = Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const total = ents.reduce((s,x)=>s+x[1],0) || 1;
  if(!ents.length) return '<p class="muted" style="margin:0">暂无支出</p>';
  return ents.map(([k,v],i)=>`
    <div class="legend"><span>${esc(k)}</span><span>${money(v)}（${(v/total*100).toFixed(1)}%）</span></div>
    <div class="bar ${'c'+((i%4)+1)}"><i style="width:${Math.max(2,v/total*100)}%"></i></div>`).join('');
}
function renderStats(){
  const list = filtered(), exp = list.filter(t=>t.direction==='支出'), inc = list.filter(t=>t.direction==='收入');
  const sum = a => a.reduce((s,t)=>s+t.amount,0);
  $('#kExp').textContent = money(sum(exp));
  $('#kInc').textContent = money(sum(inc));
  $('#kSub').textContent = `支出 ${exp.length} 笔，收入 ${inc.length} 笔，净支出 ${money(sum(exp)-sum(inc))}｜覆盖 ${new Set(exp.map(t=>t.date)).size} 天，日均 ${money(sum(exp)/Math.max(1,new Set(exp.map(t=>t.date)).size))}`;
  const group = (arr, key) => arr.reduce((o,t)=>{ o[t[key]] = (o[t[key]]||0) + t.amount; return o; }, {});
  $('#catChart').innerHTML = bars(group(exp,'cat'));
  $('#chChart').innerHTML = bars(group(exp,'channel'));
  $('#srcChart').innerHTML = bars(group(exp,'source'));
}
function renderRules(){
  const ul = $('#ruleList');
  ul.innerHTML = state.rules.length
    ? '<li class="muted" style="border:0">自定义规则优先于内置规则</li>' + state.rules.map((r,i)=>`<li class="r"><span><b>${esc(r.cat)}</b> ← ${esc(r.kw.join('、'))}</span><button class="btn danger mini" data-ri="${i}" style="padding:2px 8px;font-size:12px">删除</button></li>`).join('')
    : '<li class="muted" style="border:0">还没有自定义规则（内置规则已覆盖常见商户）</li>';
  const n = Object.keys(state.merchantMap).length;
  $('#memInfo').textContent = `已记住 ${n} 个商户的分类；已记住 ${Object.keys(state.payMap).length} 个支付方式的渠道。修改某笔的分类/渠道后会自动记住并应用到同类记录。`;
}
function renderAll(){ renderFilters(); renderList(); renderStats(); renderRules(); }
function refresh(){ save(); renderAll(); }

/* ============ 事件绑定 ============ */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick = ()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on', x===b));
  ['list','stats','data'].forEach(t=>$('#tab-'+t).classList.toggle('hide', t!==b.dataset.tab));
});
['fMonth','fSource','fChannel','fCat'].forEach(id=>$('#'+id).onchange = e=>{ F[id.slice(1).toLowerCase()] = e.target.value; page=1; renderList(); renderStats(); });
$('#fKw').oninput = e=>{ F.kw = e.target.value.trim(); page=1; renderList(); };
$('#btnReset').onclick = ()=>{ F = {month:'',source:'',channel:'',cat:'',kw:''}; $('#fKw').value=''; page=1; renderAll(); };
$('#btnMore').onclick = ()=>{ page++; renderList(); };

$('#listBox').addEventListener('change', e=>{
  const box = e.target.closest('.tx'); if(!box) return;
  const t = state.tx.find(x=>x.id===box.dataset.id); if(!t) return;
  if(e.target.classList.contains('catSel')){
    t.cat = e.target.value; t.catManual = true;
    state.merchantMap[t.title] = t.cat;
    save(); renderStats(); renderRules();
  }else if(e.target.classList.contains('chSel')){
    t.channel = e.target.value; t.chManual = true;
    if(t.payRaw) state.payMap[t.payRaw] = t.channel;
    save(); renderStats(); renderRules();
  }
});
$('#listBox').addEventListener('click', e=>{
  const b = e.target.closest('button[data-act="del"]'); if(!b) return;
  const box = e.target.closest('.tx');
  if(!confirm('删除这一笔记录？')) return;
  state.tx = state.tx.filter(x=>x.id!==box.dataset.id);
  save(); renderAll();
});

const drop = $('#drop'), file = $('#file');
drop.onclick = ()=>file.click();
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('on'); });
drop.addEventListener('dragleave', ()=>drop.classList.remove('on'));
drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('on'); handleFiles(e.dataTransfer.files); });
file.onchange = e=>{ if(e.target.files.length) handleFiles(e.target.files); e.target.value=''; };

$('#btnPaste').onclick = ()=>{
  const t = $('#pasteBox').value.trim();
  if(!t) return alert('请先粘贴内容');
  try{
    const r = addTxs(importRows(parseCSV(t)).txs);
    $('#pasteBox').value=''; refresh();
    alert(`导入完成：新增 ${r.added} 笔，跳过重复 ${r.dup} 笔`);
  }catch(err){ alert('导入失败：'+err.message); }
};

$('#btnAddRule').onclick = ()=>{
  const kw = $('#rKw').value.split(/[,，\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!kw.length) return alert('请输入至少一个关键词');
  state.rules.unshift({ cat: $('#rCat').value, kw });
  $('#rKw').value = ''; applyLearn(); refresh();
};
$('#ruleList').addEventListener('click', e=>{
  const b = e.target.closest('button[data-ri]'); if(!b) return;
  state.rules.splice(+b.dataset.ri,1); applyLearn(); refresh();
});
$('#btnClearMem').onclick = ()=>{
  if(!confirm('清空商户记忆和支付方式记忆？（记录本身保留）')) return;
  state.merchantMap = {}; state.payMap = {}; applyLearn(); refresh();
};
$('#btnClearAll').onclick = ()=>{
  if(!confirm('确定清空全部账目？建议先导出备份。')) return;
  state = { tx:[], rules:[], merchantMap:{}, payMap:{} };
  F = {month:'',source:'',channel:'',cat:'',kw:''}; refresh();
};
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\uFEFF'+text], {type: type||'text/csv;charset=utf-8'}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('#btnExpJson').onclick = ()=> download('账单备份_'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify(state), 'application/json');
$('#btnExpCsv').onclick = ()=>{
  const head = ['来源','交易时间','交易对方','商品说明','收支','金额','支付方式原文','渠道','分类','状态','交易单号','备注'];
  const rows = filtered().map(t=>[t.source,t.time,t.title,t.product,t.direction,t.amount,t.payRaw,t.channel,t.cat,t.status,t.orderNo,t.note]
    .map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(','));
  download('账单明细_'+new Date().toISOString().slice(0,10)+'.csv', [head.join(','), ...rows].join('\n'));
};
$('#fileJson').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!Array.isArray(d.tx)) throw new Error('格式不正确');
    if(!confirm('恢复备份会覆盖当前数据，继续？')) return;
    state = { tx:d.tx||[], rules:d.rules||[], merchantMap:d.merchantMap||{}, payMap:d.payMap||{} };
    applyLearn(); refresh(); alert('已恢复 '+state.tx.length+' 笔记录');
  }catch(err){ alert('恢复失败：'+err.message); }
  e.target.value='';
};

  const demo = [
    ['微信','2026-09-02 08:12','瑞幸咖啡','拿铁','支出',19,'零钱'],

    ['支付宝','2026-09-06 19:22','淘宝','衣服','支出',259,'花呗'],
    ['支付宝','2026-09-09 07:50','地铁','乘车码','支出',5,'账户余额'],
    ['支付宝','2026-09-12 20:05','中国移动','话费充值','支出',100,'中国银行储蓄卡(1234)'],
    ['支付宝','2026-09-15 13:10','饿了么','午餐','支出',28.8,'亲情卡'],
    ['支付宝','2026-09-20 10:00','转账-李四','','支出',500,'余额宝'],

  const txs = demo.map(d=>{

      status:'支付成功', orderNo:'', note:'', catManual:false, chManual:false };
    t.channel = state.payMap[t.payRaw] || classifyChannel(t.payRaw);
    t.cat = classifyCategory(t);
    return t;
  });
  const r = addTxs(txs);

/* ============ 启动 ============ */
load();
if(state.tx.length) applyLearn();
renderAll();
</script>
